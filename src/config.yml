Global:
  # One of mi2log and xml_log should be provided
  # mi2lg should be provided if Controller.enable is True
  mi2log: ./test/diag_log_sm00_2024-06-19_18-10-05.mi2log
  xml_log: ./test/diag_log_sm00_2024-06-19_18-10-05.xml

  # optional
  db_log: ./test/diag_log_sm00_2024-06-19_18-10-05.db

DL_Profile_Based_Controller:
  enable: False
  parameters_file: test/br_dl_test_event_params.csv
  interface: veth2
  perfect_stable: True
  burst_mbit: 100
  rate_mbit: 30
  latency_ms: 5

DL_Playback_Controller:
  enable: False
  udp_traffic_csv: ./test/udp_dnlk_loss_latency.csv
  interface: veth2
  burst_mbit: 100
  rate_mbit: 30
  latency_ms: 5
  resample_s: 0.3

DL_Moving_Average_Playback_Controller:
  enable: True
  udp_traffic_csv: ./test/udp_dnlk_loss_latency.csv
  interface: dl_veth
  burst_mbit: 100
  rate_mbit: 30
  latency_ms: 5
  resample_s: 0.3
  rolling_wnd_size_s: 1

UL_Moving_Average_Playback_Controller:
  enable: True
  udp_traffic_csv: ./test/udp_uplk_loss_latency.csv
  interface: up_veth
  burst_mbit: 100
  rate_mbit: 30
  latency_ms: 5
  resample_s: 0.3
  rolling_wnd_size_s: 1
  
Replayer:
  enable: True
  virt_serial_port: /dev/ttyV0