Global:
  offset_time: 1718670230.0
  duration: 60

Controllers:
  - type: Multi_Band_Moving_Average_Playback_Controller # modem 2 dl
    enable: True
    interface: dl_veth2
    burst_mbit: 100
    rate_mbit: 30
    latency_ms: 5
    resample_s: 0.3
    rolling_wnd_size_s: 1
    shm_file: "/dev/shm/band_setting2"
    band_candidates:
    - band: b1_b3
      traffic: ./test/multi_band/sm02/udp_dnlk_loss_latency.csv
    - band: b1_b7
      traffic: ./test/multi_band/sm03/udp_dnlk_loss_latency.csv
