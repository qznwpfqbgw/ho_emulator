Replayers: 
  - type: Multi_Band_Log_Raw_Replayer # modem1
    enable: True
    modem_type: Virtual_Modem
    virt_serial_ports: /dev/ttyV2
    shm_file: "/dev/shm/band_setting1"
    merged_mi2log: ./test/multi_band/sm01.db
    mi2log: ""
    band_candidates:
    - band: b1_b3_b7_b8
      mi2log: ./test/multi_band/sm01/diag_log_sm01_2024-06-18_15-53-03.mi2log

